<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Speech Recognition Notes – Enhanced</title>

    <!-- 🌟 Beautiful Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            padding: 40px;
            max-width: 900px;
            margin: auto;
            background: linear-gradient(135deg, #b7d1ff 0%, #eaeaea 100%);
            animation: bgPulse 6s ease-in-out infinite alternate;
            transition: background 0.5s, color 0.5s;
            line-height: 1.6;
        }

        @keyframes bgPulse {
            0% { background: linear-gradient(135deg, #b7d1ff 0%, #eaeaea 100%); }
            100% { background: linear-gradient(135deg, #eaeaea 0%, #b7d1ff 100%); }
        }

        h2 {
            text-align: center;
            font-size: 42px;
            margin-bottom: 25px;
            color: #111;
            letter-spacing: 0.7px;
            font-family: "Montserrat", sans-serif;
            font-weight: 600;
        }

        .container {
            background: rgba(255, 255, 255, 0.72);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
            backdrop-filter: blur(8px);
        }

        textarea {
            width: 96%;
            height: 170px;
            font-size: 19px;
            padding: 15px;
            border-radius: 14px;
            border: 2px solid #aaa;
            background: rgba(255,255,255,0.75);
            outline: none;
            transition: 0.3s;
            font-family: "Poppins", sans-serif;
            line-height: 1.5;
        }

        textarea:focus {
            border-color: #5a7dff;
            box-shadow: 0 0 12px rgba(100,120,255,0.35);
            background: #fff;
        }

        .btn-row {
            text-align: center;
            margin-top: 15px;
        }

        button {
            padding: 14px 32px;
            margin: 10px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.25s ease;
            font-weight: 600;
            font-family: "Montserrat", sans-serif;
        }

        button:hover {
            transform: scale(1.05);
        }

        #startBtn { background: #27c452; color: white; }
        #stopBtn { background: #d72e34; color: white; }
        #saveBtn { background: #2a7bff; color: white; }

        #status {
            text-align: center;
            margin-top: 8px;
            font-size: 19px;
            font-weight: 600;
            font-family: "Montserrat", sans-serif;
        }

        h3 {
            margin-top: 30px;
            font-size: 28px;
            border-bottom: 3px solid #666;
            padding-bottom: 5px;
            font-family: "Montserrat", sans-serif;
        }

        .note {
            padding: 15px;
            margin: 12px 0;
            background: rgba(255,255,255,0.9);
            border-left: 6px solid #2a7bff;
            border-radius: 10px;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: 0.3s;
            line-height: 1.5;
            font-family: "Poppins", sans-serif;
        }

        .note:hover {
            transform: translateX(5px);
        }

        /* 🌙 Dark Mode */
        body.dark {
            background: linear-gradient(135deg, #131313 0%, #222 100%);
            color: #eee;
        }

        body.dark .container {
            background: rgba(30,30,30,0.65);
            color: #fff;
        }

        body.dark textarea {
            background: rgba(60,60,60,0.7);
            color: #fff;
            border-color: #777;
        }

        body.dark .note {
            background: rgba(60,60,60,0.8);
            border-left-color: #4ca2ff;
        }

        #themeToggle {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            background: #000;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            border: none;
            font-family: "Montserrat", sans-serif;
        }

        #themeToggle:hover { transform: scale(1.08); }

        .mic-icon {
            animation: micPulse 1.4s ease-in-out infinite alternate;
        }

        @keyframes micPulse {
            0% { opacity: 0.4; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.15); }
        }
    </style>
</head>
<body>

<button id="themeToggle">🌙 Dark Mode</button>

<h2>🎤 Speech Recognition Note Maker</h2>

<div class="container">
    <textarea id="text" placeholder="Your speech will appear here..."></textarea>

    <div class="btn-row">
        <button id="startBtn"><span class="mic-icon">🎙</span> Start</button>
        <button id="stopBtn">Stop ✋</button>
        <button id="saveBtn">Save 💾</button>
    </div>

    <div id="status"></div>
</div>

<h3>Saved Notes:</h3>
<div id="notes"></div>

<script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();

    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = "en-US";

    const input = document.getElementById("text");
    const notesDiv = document.getElementById("notes");
    const status = document.getElementById("status");

    recognition.onresult = (event) => {
        let transcript = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
        }
        input.value = transcript;
    };

    document.getElementById("startBtn").onclick = () => {
        recognition.start();
        status.innerText = "🎤 Listening...";
        status.style.color = "#27c452";
    };

    document.getElementById("stopBtn").onclick = () => {
        recognition.stop();
        status.innerText = "⏹ Stopped.";
        status.style.color = "#d72e34";
    };

    document.getElementById("saveBtn").onclick = () => {
        const text = input.value.trim();
        if (!text) return alert("Nothing to save!");

        const note = document.createElement("div");
        note.className = "note";

        const timestamp = new Date().toLocaleString();

        note.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <strong>${timestamp}</strong><br>${text}
                </div>
                <button class="delete-note" style="
                    background:#d9534f;
                    color:white;
                    border:none;
                    padding:8px 12px;
                    border-radius:8px;
                    cursor:pointer;
                    font-family: 'Montserrat', sans-serif;
                ">🗑️</button>
            </div>
        `;

        notesDiv.appendChild(note);
        input.value = "";
    };

    notesDiv.addEventListener("click", (e) => {
        if (e.target.classList.contains("delete-note")) {
            e.target.closest(".note").remove();
        }
    });

    const themeBtn = document.getElementById("themeToggle");

    themeBtn.onclick = () => {
        document.body.classList.toggle("dark");
        themeBtn.innerText = document.body.classList.contains("dark")
            ? "☀️ Light Mode"
            : "🌙 Dark Mode";
    };
</script>

</body>
</html>
